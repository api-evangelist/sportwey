name: Sportwey
description: >-
  Sportwey is a Mexican SaaS platform that digitizes and automates the
  operations of sports organizations across multiple segments — tournaments and
  leagues, training academies, and sports facilities. It provides team
  management, scheduling, results and statistics, attendance and membership
  tracking, payments, class scheduling, court and field reservations, and
  referee coordination. The company reports more than 10,000 organizers and 2.3
  million players using the platform, delivered through dedicated player and
  referee apps and a manager back office. Sportwey is a portfolio company of 500
  Global. As of this enrichment pass it publishes no public API, developer
  portal, or API documentation.
